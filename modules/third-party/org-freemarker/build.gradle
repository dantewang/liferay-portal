import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task deployJar(type: Copy)
task patch(type: PatchTask)

sourceCompatibility = "1.6"
targetCompatibility = "1.6"

dependencies {
	compile group: "org.freemarker", name: "freemarker", optional, version: "2.3.23"
}

deploy {
	finalizedBy deployJar
}

deployJar {
	ext {
		autoClean = false
	}

	from jar
	into "../../../lib/development"

	rename {
		"freemarker.jar"
	}
}

liferay {
	deployDir = file("${liferayHome}/osgi/modules")
}

patch {
	ext {
		autoClean = false
	}

	fileNames "freemarker/ext/beans/ClassIntrospector.java"

	originalLibModuleName = "freemarker"
}