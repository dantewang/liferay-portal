task jarPatched(type: Zip)

dependencies {
	compileOnly group: "org.bouncycastle", name: "bcprov-jdk15on", version: "1.69"
}

jar {
	setActions([])

	dependsOn jarPatched
}

jarPatched {
	archiveName = jar.archiveName
	destinationDir = jar.destinationDir
	duplicatesStrategy = "exclude"

	exclude "**/META-INF/versions/9/**"
	exclude "**/META-INF/versions/11/**"
	exclude "**/META-INF/versions/15/**"

	from sourceSets.main.output

	from {
		zipTree(configurations.compileOnly.singleFile)
	}
}