apply plugin: "com.gradle.plugin-publish"
apply plugin: "org.ysb33r.gradletest"

task copyGradleTestDependencies(type: Copy)

String gradleVersion = "5.6.4"

tasks.eclipse {
	ext.gradleVersion = gradleVersion
}

copyGradleTestDependencies {
	from configurations.compile
	into jar.destinationDir
}

dependencies {
	compile group: "com.liferay", name: "com.liferay.gradle.util", version: "1.0.36"
	compile group: "com.liferay", name: "tomcat-jasper", version: "9.0.33.LIFERAY-PATCHED-1"
	compile group: "javax.servlet.jsp", name: "javax.servlet.jsp-api", version: "2.3.2-b01"
	compile group: "javax.servlet.jsp.jstl", name: "javax.servlet.jsp.jstl-api", version: "1.2.1"
	compile group: "org.apache.tomcat", name: "tomcat-api", version: "9.0.33"
	compile group: "org.apache.tomcat", name: "tomcat-juli", version: "9.0.33"
	compile group: "org.apache.tomcat", name: "tomcat-util", version: "9.0.33"
	compile group: "org.apache.tomcat", name: "tomcat-util-scan", version: "9.0.33"
	compile group: "org.glassfish", name: "javax.el", version: "3.0.1-b05"
	compile group: "org.glassfish", name: "javax.servlet", version: "3.2-b06"
	compile group: "org.glassfish.web", name: "javax.servlet.jsp.jstl", version: "1.2.3"
	compile group: "org.osgi", name: "osgi.core", version: "6.0.0"

	compileOnly fileTree(builtBy: [rootProject.tasks.getByName("extractGradleApi" + gradleVersion.replace(".", ""))], dir: new File(rootProject.buildDir, "gradle-${gradleVersion}"))
}

gradleTest {
	dependsOn copyGradleTestDependencies
	dependsOn jar

	versions gradleVersion
}

pluginBundle {
	tags = ["jasper", "java", "jsp", "jspc"]
}