apply plugin: "com.gradle.plugin-publish"

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

String gradleVersion = "8.5"

if (Boolean.getBoolean("gradle.test.enabled")) {
	apply from: "test.gradle"
}

tasks.eclipse {
	ext.gradleVersion = gradleVersion
}

dependencies {
	api group: "com.liferay", name: "com.liferay.gradle.util", version: "1.0.49"
	api group: "com.liferay", name: "org.apache.tomcat.jasper", version: "9.0.90.LIFERAY-PATCHED-1"
	api group: "javax.servlet.jsp", name: "javax.servlet.jsp-api", version: "2.3.2-b01"
	api group: "javax.servlet.jsp.jstl", name: "javax.servlet.jsp.jstl-api", version: "1.2.1"
	api group: "org.apache.tomcat", name: "tomcat-api", version: "9.0.90"
	api group: "org.apache.tomcat", name: "tomcat-juli", version: "9.0.90"
	api group: "org.apache.tomcat", name: "tomcat-util", version: "9.0.90"
	api group: "org.apache.tomcat", name: "tomcat-util-scan", version: "9.0.90"
	api group: "org.glassfish", name: "javax.el", version: "3.0.1-b05"
	api group: "org.glassfish", name: "javax.servlet", version: "3.2-b06"
	api group: "org.glassfish.web", name: "javax.servlet.jsp.jstl", version: "1.2.3"
	api group: "org.osgi", name: "osgi.core", version: "6.0.0"

	compileOnly fileTree(builtBy: [rootProject.tasks.getByName("extractGradleApi" + gradleVersion.replace(".", ""))], dir: new File(rootProject.buildDir, "gradle-${gradleVersion}"))
}

pluginBundle {
	tags = ["jasper", "java", "jsp", "jspc"]
}