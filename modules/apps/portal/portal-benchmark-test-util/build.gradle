dependencies {
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "junit", name: "junit", version: "4.13.1"
	compileOnly project(":core:petra:petra-io")
	compileOnly project(":core:petra:petra-lang")
	compileOnly project(":core:petra:petra-string")
}

liferay {
	deployDir = file("${liferayHome}/osgi/test")
}

test {
	systemProperty "benchmarksDir", System.getProperty("benchmarksDir", "../../../../benchmarks")
	systemProperty "runCount", System.getProperty("runCount", "1")
	systemProperty "threadCount", System.getProperty("threadCount", "1")
}