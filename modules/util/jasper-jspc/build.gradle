sourceCompatibility = "1.8"
targetCompatibility = "1.8"

dependencies {
	compile group: "com.liferay", name: "com.liferay.portal.osgi.web.servlet.jsp.compiler", version: "5.0.0"
	compile group: "javax.servlet.jsp", name: "javax.servlet.jsp-api", version: "2.3.2-b01"
	compile group: "javax.servlet.jsp.jstl", name: "javax.servlet.jsp.jstl-api", version: "1.2.1"
	compile group: "org.apache.ant", name: "ant", version: "1.9.14"
	compile group: "org.glassfish", name: "javax.el", version: "3.0.1-b05"
	compile group: "org.glassfish", name: "javax.servlet", version: "3.2-b06"
	compile group: "org.glassfish.web", name: "javax.servlet.jsp.jstl", version: "1.2.3"
	compile group: "org.osgi", name: "osgi.core", version: "6.0.0"
}

liferay {
	deployDir = "../../../tools/sdk/dependencies/com.liferay.jasper.jspc/lib"
}

updateFileVersions {
	match(/com\.liferay\.jasper\.jspc=(\d.+)/, "../../sdk/gradle-plugins/src/main/resources/com/liferay/gradle/plugins/dependencies/portal-tools.properties")
}